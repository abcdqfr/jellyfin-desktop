# Forgejo Actions — mirrors upstream GitHub AppImage Docker smoke for integration coverage.
# Requires act_runner with Docker + label matching runs-on (see infrastructure/forgejo README).
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  appimage-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker AppImage build (integration smoke)
        run: docker build -t jellyfin-desktop-ci -f dev/appimage/Dockerfile .
